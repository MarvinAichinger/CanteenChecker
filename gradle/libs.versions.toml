[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
# COMPOSE
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
# VIEWMODEL
lifecycleViewmodelCompose = "2.11.1"
# ICONS
materialIconsCore = "1.7.8"
# RETROFIT
retrofit = "3.0.0"
kotlinSerializationJson = "1.13.0"
# NAVIGATION
nav3 = "1.2.2"
# MSAL
msal = "8.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# COMPOSE
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# VIEWMODEL
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
# ICONS
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "materialIconsCore" }
# RETROFIT
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinSerializationJson" }
# NAVIGATION
androidx-navigation-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "nav3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelCompose"}
# MSAL
msal = { group = "com.microsoft.identity.client", name = "msal", version.ref = "msal" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# COMPOSE
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# SERIALIZATION
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"}
